version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: import-csv-dev
    ports:
      - "4200:4200"
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      - NODE_ENV=development
    command: npm start
    stdin_open: true
    tty: true
